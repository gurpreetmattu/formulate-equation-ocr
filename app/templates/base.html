<!DOCTYPE html>
<html lang="en" data-theme="{{ request.cookies.get('theme', '') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Convert images of printed math equations into LaTeX and MathML using a deep learning OCR pipeline.">
<title>{% block title %}Formulate{% endblock %}</title>

<link rel="canonical" href="{{ request.base_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Formulate">
<meta property="og:title" content="{% block og_title %}Formulate{% endblock %}">
<meta property="og:description" content="Convert images of printed math equations into LaTeX and MathML using a deep learning OCR pipeline.">
<meta property="og:url" content="{{ request.base_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% block twitter_title %}Formulate{% endblock %}">
<meta name="twitter:description" content="Convert images of printed math equations into LaTeX and MathML.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236f63e0'/%3E%3Cpath d='M8 4h8M8 20h8M9 4c0 4-3 5-3 8s3 4 3 8M15 4c0 4 3 5 3 8s-3 4-3 8' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon.svg') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#6f63e0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js" defer></script>
<script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="{{ url_for('routes.recognize_page') }}">
    <span class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 4h8M8 20h8M9 4c0 4-3 5-3 8s3 4 3 8M15 4c0 4 3 5 3 8s-3 4-3 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    Formulate
  </a>
  <div class="navbar-right">
    <div class="nav-links" id="nav-links">
      <a href="{{ url_for('routes.recognize_page') }}" class="{{ 'active' if request.endpoint in ('routes.recognize_page',) else '' }}">Recognize</a>
      <a href="{{ url_for('routes.about_page') }}" class="{{ 'active' if request.endpoint == 'routes.about_page' else '' }}">About</a>
    </div>
    <button type="button" id="theme-toggle" class="btn-icon theme-toggle" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer>
  Formulate &mdash; automated printed equation recognition, LaTeX &amp; MathML conversion
</footer>
<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
